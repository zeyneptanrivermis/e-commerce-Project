<div *ngIf="isLoading" class="loading text-center py-8 text-lavanta-grisi">Loading…</div>

<div *ngIf="!isLoading && pending.length" class="overflow-x-auto rounded-lg shadow-md bg-beyaz">
  <table class="table min-w-full divide-y divide-lavanta-grisi/20">
    <thead class="bg-gece-yarisi text-beyaz">
      <tr>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium  uppercase tracking-wider">Order ID</th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium  uppercase tracking-wider">Customer</th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium  uppercase tracking-wider">Amount (₺)</th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium  uppercase tracking-wider">Payment Date</th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium  uppercase tracking-wider">Action</th>
      </tr>
    </thead>
    <tbody class="bg-beyaz divide-y divide-lavanta-grisi/20 text-lacivert-derin">
      <tr *ngFor="let o of pending">
        <td class="px-6 py-4 whitespace-nowrap">{{ o.orderId }}</td>
        <td class="px-6 py-4 whitespace-nowrap">{{ o.customerName }}</td>
        <td class="px-6 py-4 whitespace-nowrap">{{ o.totalWithDiscount | currency:'TRY':'symbol' }}</td>
        <td class="px-6 py-4 whitespace-nowrap">{{ o.paymentDate | date:'short' }}</td>
        <td class="px-6 py-4 whitespace-nowrap">
          <button class="bg-acik-pembe hover:bg-lavanta-grisi text-beyaz font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline text-sm transition-colors duration-200" (click)="approve(o.orderId)">
            Approve
          </button>
          <button class="bg-acik-pembe hover:bg-lavanta-grisi text-beyaz font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline text-sm transition-colors duration-200 ml-2" (click)="decline(o.orderId)">
            Decline
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="!isLoading && !pending.length" class="no-data text-center py-8 text-lavanta-grisi">
  No pending refund requests.
</div>

<div *ngIf="error" class="error text-acik-pembe text-center py-4">
  {{ error }}
</div>
