<div class="admin-container">
  <aside class="admin-menu">
    <ul>
      <li (click)="setTab('dashboard')" [class.active]="tab === 'dashboard'">📊 Dashboard</li>
      <li (click)="setTab('users')" [class.active]="tab === 'users'">👥 Kullanıcılar</li>
      <li (click)="setTab('products')" [class.active]="tab === 'products'">📦 Ürünler</li>
      <li (click)="setTab('orders')" [class.active]="tab === 'orders'">🧾 Siparişler</li>
      <li (click)="setTab('support')" [class.active]="tab === 'support'">💬 Destek</li>
    </ul>

    <!-- 🔻 Logout butonu sabit alt kısımda -->
    <div class="logout-section">
      <button (click)="logout()" class="logout-button">🚪 Çıkış Yap</button>
    </div>
  </aside>

  <section class="admin-content">
    <ng-container [ngSwitch]="tab">
      <div *ngSwitchCase="'dashboard'">📊 Dashboard içeriği</div>
      <div *ngSwitchCase="'users'">👥 Kullanıcı yönetimi</div>
      <div *ngSwitchCase="'products'">📦 Ürün yönetimi</div>
      <div *ngSwitchCase="'orders'">🧾 Sipariş yönetimi</div>
      <div *ngSwitchCase="'support'">💬 Destek sistemi</div>
      <div *ngSwitchDefault>🔍 İçerik seçin</div>
    </ng-container>
  </section>
</div>
