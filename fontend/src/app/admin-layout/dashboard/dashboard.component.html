<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-in {
      animation: fade-in 0.3s ease-out forwards;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 p-8 min-h-screen box-border">
  <h1 class="text-3xl font-bold text-lacivert-derin mb-2">Dashboard</h1>
  <p class="text-xl text-gece-yarisi mb-8">Welcome, Admin!</p>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="bg-white rounded-lg shadow-md border-l-4 border-acik-pembe transition-transform hover:scale-105 hover:shadow-lg animate-fade-in">
      <div class="p-6">
        <h2 class="text-lg font-semibold text-lacivert-derin mb-2">Total Admins</h2>
        <p class="text-2xl font-bold text-acik-pembe">{{ stats?.userCount | number }}</p>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow-md border-l-4 border-acik-pembe transition-transform hover:scale-105 hover:shadow-lg animate-fade-in" style="animation-delay: 0.1s;">
      <div class="p-6">
        <h2 class="text-lg font-semibold text-lacivert-derin mb-2">Total Products</h2>
        <p class="text-2xl font-bold text-acik-pembe">{{ stats?.productCount | number }}</p>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow-md border-l-4 border-acik-pembe transition-transform hover:scale-105 hover:shadow-lg animate-fade-in" style="animation-delay: 0.2s;">
      <div class="p-6">
        <h2 class="text-lg font-semibold text-lacivert-derin mb-2">Pending Orders</h2>
        <p class="text-2xl font-bold text-acik-pembe">{{ stats?.pendingOrders | number }}</p>
      </div>
    </div>
  </div>

  <h2 class="text-xl font-semibold text-lacivert-derin mb-4 mt-10">Number of Products by Category</h2>
  <div class="bg-white p-6 rounded-lg shadow-md">
    <canvas #categoryChart class="w-full h-[400px]"></canvas>
  </div>


</body>
</html>
