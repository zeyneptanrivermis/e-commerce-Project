<div class="container mt-4">
  <div class="chart-container" style="display: flex; justify-content: center; margin-bottom: 2rem;">
    <canvas #pieChart width="180" height="180"></canvas>
    <div style="margin-left: 2rem; display: flex; flex-direction: column; justify-content: center;">
      <div><span class="legend-color" style="background:#fbbf24"></span> Pending</div>
      <div><span class="legend-color" style="background:#34d399"></span> Accepted</div>
      <div><span class="legend-color" style="background:#f87171"></span> Cancelled</div>
    </div>
  </div>

  <h2>All Orders</h2>
  
  <div class="table-responsive">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Total</th>
          <th>Status</th>
          <th>Payment Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of orders">
          <td>#{{order.orderId}}</td>
          <td>{{order.customerName}}</td>
          <td>${{order.totalWithDiscount | number:'1.2-2'}}</td>
          <td>
            <select [(ngModel)]="order.status" (change)="changeStatus(order, order.status)">
              <option value="PENDING">PENDING</option>
              <option value="COMPLETED">COMPLETED</option>
              <option value="CANCELLED">CANCELLED</option>
            </select>
          </td>
          <td>{{order.paymentDate | date:'medium'}}</td>
          <td>
            <button class="btn btn-sm btn-primary me-2" (click)="viewOrderDetails(order)">
              View Details
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
