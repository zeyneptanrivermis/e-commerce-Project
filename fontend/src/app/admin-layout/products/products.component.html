<div class="bg-white rounded-lg shadow-md p-6">
  <h2 class="text-xl font-semibold text-[#201E43] mb-4">Product List</h2>

  <div class="overflow-x-auto max-h-[500px] overflow-y-auto rounded-md border border-gray-200">
    <table class="min-w-full leading-normal">
      <thead class="sticky top-0 z-10 bg-[#508C9B] text-white">
        <tr>
          <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-xs font-semibold uppercase tracking-wider">
            ID
          </th>
          <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-xs font-semibold uppercase tracking-wider">
            Name
          </th>
          <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-xs font-semibold uppercase tracking-wider">
            Price
          </th>
          <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-xs font-semibold uppercase tracking-wider">
            Status
          </th>
          <th class="px-5 py-3 border-b-2 border-gray-200 text-left text-xs font-semibold uppercase tracking-wider">
            Action
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of products; let i = index" class="animate-fade-in" [style.animationDelay]="i * 0.05 + 's'">
          <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
            {{ p.id }}
          </td>
          <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
            {{ p.name }}
          </td>
          <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
            {{ p.price }} ₺
          </td>
          <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
            <span [ngClass]="{ 'text-red-500': p.cancelled, 'text-green-500': !p.cancelled }">
              {{ p.cancelled ? 'Cancelled' : 'Active' }}
            </span>
          </td>
          <td class="px-5 py-5 border-b border-gray-200 bg-white text-sm">
            <button (click)="cancelProduct(p.id)" [disabled]="p.cancelled"
              class="bg-[#134B70] hover:bg-[#201E43] text-[#EEEEEE] font-bold py-2 px-4 rounded-md text-sm transition duration-300"
              [ngClass]="{ 'opacity-50 cursor-not-allowed': p.cancelled }">
              Cancel
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Animasyon -->
<style>
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .animate-fade-in {
    animation: fade-in 0.2s ease-out forwards;
  }
</style>
