<div class="bg-beyaz rounded-lg shadow-md p-6">
  <h2 class="text-2xl font-semibold text-acik-pembe mb-4">Product List</h2>

  <div class="overflow-x-auto rounded-md">
    <table class="min-w-full divide-y divide-lavanta-grisi/20">
      <thead class="bg-gece-yarisi text-white">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">
            ID
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">
            Name
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">
            Price
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">
            Status
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">
            Action
          </th>
        </tr>
      </thead>
      <tbody class="bg-beyaz divide-y divide-lavanta-grisi/20 text-lacivert-derin">
        <tr *ngFor="let p of products; let i = index" class="animate-fade-in" [style.animationDelay]="i * 0.05 + 's'">
          <td class="px-6 py-4 whitespace-nowrap">
            {{ p.id }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            {{ p.name }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            {{ p.price }} ₺
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span [ngClass]="{ 'text-red-500': p.cancelled, 'text-green-500': !p.cancelled }">
              {{ p.cancelled ? 'Cancelled' : 'Active' }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <button (click)="cancelProduct(p.id)"
              class="bg-acik-pembe hover:bg-lavanta-grisi text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline text-sm transition-colors duration-200">
              {{ p.cancelled ? 'Uncancel' : 'Cancel' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<style>
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .animate-fade-in {
    animation: fade-in 0.2s ease-out forwards;
  }
</style>
