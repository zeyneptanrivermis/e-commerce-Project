<div class="card">
  <h2>Ürün Listesi</h2>
  <table class="user-table">
    <thead>
      <tr>
        <th>ID</th><th>Ad</th><th>Fiyat</th><th>Durum</th><th>İşlem</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of products">
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.price }} ₺</td>
        <td>{{ p.cancelled ? 'İptal Edildi' : 'Aktif' }}</td>
        <td>
          <button (click)="cancelProduct(p.id)" [disabled]="p.cancelled">İptal Et</button>
          <button (click)="deleteProduct(p.id)" [disabled]="!p.cancelled">Sil</button>
        </td>
        
      </tr>
    </tbody>
  </table>
</div>
