<div class="card bg-beyaz rounded-lg shadow-md p-6">
  <h2 class="text-2xl font-semibold text-acik-pembe mb-4">Users</h2>
  <div class="overflow-x-auto">
  <table class="user-table min-w-full divide-y divide-lavanta-grisi/20">
    <thead class="bg-gece-yarisi text-white">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium  uppercase tracking-wider">ID</th>
        <th class="px-6 py-3 text-left text-xs font-medium  uppercase tracking-wider">Name</th>
        <th class="px-6 py-3 text-left text-xs font-medium  uppercase tracking-wider">Email</th>
        <th class="px-6 py-3 text-left text-xs font-medium  uppercase tracking-wider">Role</th>
        <th class="px-6 py-3 text-left text-xs font-medium  uppercase tracking-wider">Action</th>
      </tr>
    </thead>
    <tbody class="bg-beyaz divide-y divide-lavanta-grisi/20 text-lacivert-derin">
      <tr *ngFor="let u of users">
        <td class="px-6 py-4 whitespace-nowrap">{{ u.userId }}</td>
        <td class="px-6 py-4 whitespace-nowrap">{{ u.name }}</td>
        <td class="px-6 py-4 whitespace-nowrap">{{ u.email }}</td>
        <td class="px-6 py-4 whitespace-nowrap">{{ u.roles.join(', ') }}</td>
        <td class="px-6 py-4 whitespace-nowrap space-x-2">
          <button class="bg-acik-pembe hover:bg-lavanta-grisi text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline text-sm transition-colors duration-200" (click)="edit(u)">Edit</button>
          <button class="bg-acik-pembe hover:bg-lavanta-grisi text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline text-sm transition-colors duration-200" (click)="toggleBan(u)">
            {{ u.banned ? 'Unban' : 'Ban' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  </div>
</div>

<div class="modal-backdrop fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center" *ngIf="editingUser">
  <div class="modal bg-beyaz rounded-lg shadow-xl p-8 w-full max-w-md">
    <h3 class="text-xl font-semibold text-acik-pembe mb-4">Edit User</h3>
    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">Name</label>
        <input formControlName="name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
      </div>
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
        <input formControlName="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
       </div>
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">Roles (comma-separated)</label>
        <input formControlName="roles" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
      </div>

      <div class="actions flex justify-end space-x-2 mt-6">
        <button type="button" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition-colors duration-200" (click)="cancel()">Cancel</button>
        <button type="submit" class="bg-acik-pembe hover:bg-lavanta-grisi text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline disabled:opacity-50 transition-colors duration-200" [disabled]="form.invalid">Save</button>
      </div>
    </form>
  </div>
</div>
