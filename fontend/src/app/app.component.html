<ng-container *ngIf="dataLoaded; else loading">

  <!-- 1) Non-admin layout -->
  <ng-container *ngIf="showLayout; else adminOnly">
    <app-navbar class="fixed-navbar"></app-navbar>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

    <app-footer class="fixed-footer"></app-footer>

    <!-- 5) Chat-bot sadece non-admin ve (istersen) login olmuşsa -->
    <app-chat
      class="chat-bot"
      *ngIf="isLoggedIn">
    </app-chat>
  </ng-container>

  <!-- 2) Admin-only layout -->
  <ng-template #adminOnly>
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </ng-template>

</ng-container>

<ng-template #loading>
  <div class="loading">Loading…</div>
</ng-template>
