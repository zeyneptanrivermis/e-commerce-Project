<div
class="app-container"
*ngIf="isLoggedIn && userRoles?.includes('ROLE_ADMIN')">
<a  href="/admin">Log in</a>
  <router-outlet></router-outlet>
</div>

<div
  class="app-container"
  *ngIf="!isLoggedIn || userRoles?.includes('ROLE_CUSTOMER')">
  <app-navbar></app-navbar>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <app-footer></app-footer>
  <app-chat *ngIf="isLoggedIn"></app-chat> <!-- sayfa dışı sabit chat butonu -->
</div>
