<div class="login-wrapper">
  <div class="login-left">
    <div class="branding">
      <h1>Hoş Geldiniz!</h1>
      <p>Alışverişin en hızlı yolu burada.</p>
      <img src="assets/login-illustration.svg" alt="Alışveriş Görseli" />
    </div>
  </div>

  <div class="login-right">
    <div class="form-box">
      <div class="form-header">
        <h2>Giriş Yap</h2>
        <p>Devam etmek için bilgilerinizi girin</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="doLogin()">
        <div class="input-group">
          <label for="email">E-Posta</label>
          <input type="email" id="email" formControlName="email" placeholder="E-posta adresinizi girin" />
        </div>

        <div class="input-group">
          <label for="password">Şifre</label>
          <input type="password" id="password" formControlName="password" placeholder="Şifrenizi girin" />
        </div>

        <div class="form-actions">
          <a routerLink="/forgot-password">Şifrenizi mi unuttunuz?</a>
        </div>

        <button type="submit" [disabled]="loginForm.invalid">GİRİŞ YAP</button>

        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
      </form>

      <div class="separator"><span>ya da</span></div>

      <div class="extra-actions">
        <p>Hesabınız yok mu? <a routerLink="/register">Kayıt Olun</a></p>
        <p>Mağazanız mı var? <a routerLink="/seller-register">Satıcı olarak kayıt olun</a></p>
      </div>
    </div>
  </div>
</div>
