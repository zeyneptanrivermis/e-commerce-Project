<div class="min-h-screen w-full bg-gradient-to-br from-[#4F8FC0] via-[#A1C4FD] to-[#E0C3FC] flex items-center justify-center">
  <div class="flex flex-col md:flex-row w-full max-w-5xl mx-auto rounded-3xl shadow-2xl overflow-hidden bg-gradient-to-r from-[#F0F4FF]/90 via-[#A1C4FD]/90 to-[#E0C3FC]/90">
    
    <!-- Left Info Panel (Opsiyonel) -->
    <div class="p-12 md:w-1/2 flex flex-col justify-center items-center bg-gradient-to-b from-[#F0F4FF]/90 to-[#A1C4FD]/70 rounded-3xl md:rounded-r-none">
      <h2 class="text-3xl font-semibold text-[#2B3A67] mb-6">Join Our Family</h2>
      <p class="text-sm text-[#2B3A67] text-center max-w-sm">
        Become a member today and enjoy exclusive deals, faster checkout, and personalized experiences!
      </p>
    </div>

    <!-- Right - Signup Form -->
    <div class="p-12 md:w-1/2 flex flex-col justify-center bg-gradient-to-b from-[#A1C4FD]/90 to-[#F0F4FF]/70 rounded-3xl md:rounded-l-none">
      <div class="max-w-md w-full mx-auto">
        <div class="mb-8">
          <h2 class="text-3xl font-bold text-[#2B3A67]">Sign Up</h2>
          <p class="text-sm text-[#4F8FC0] mt-1">Create your account to get started</p>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="doRegister()" class="space-y-5">

          <div class="flex gap-4">
            <div class="flex-1">
              <label for="name" class="block text-sm font-medium text-[#2B3A67]">Name</label>
              <input id="name" type="text" formControlName="name" placeholder="Your name" class="input-field"/>
            </div>
            <div class="flex-1">
              <label for="surname" class="block text-sm font-medium text-[#2B3A67]">Surname</label>
              <input id="surname" type="text" formControlName="surname" placeholder="Your surname" class="input-field"/>
            </div>
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-[#2B3A67]">E-Mail</label>
            <input type="email" id="email" formControlName="email" placeholder="Enter your email" class="input-field"/>
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-[#2B3A67]">Password</label>
            <input type="password" id="password" formControlName="password" placeholder="Enter your password" class="input-field"/>
          </div>

          <div>
            <label for="confirmPassword" class="block text-sm font-medium text-[#2B3A67]">Confirm Password</label>
            <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="Re-enter your password" class="input-field"/>
          </div>

          <div>
            <label for="birthday" class="block text-sm font-medium text-[#2B3A67]">Date of Birth</label>
            <input type="date" id="birthday" formControlName="birthday" class="input-field"/>
          </div>

          <div>
            <label class="block text-sm font-medium text-[#2B3A67] mb-1">Gender (Optional)</label>
            <div class="flex gap-3">
              <button type="button" (click)="selectGender('Kadın')" 
                [ngClass]="{'bg-[#FF96AD] text-white': registerForm.value.gender === 'Kadın', 'bg-white text-[#2B3A67]': registerForm.value.gender !== 'Kadın'}"
                class="px-4 py-2 rounded-xl border border-[#4F8FC0] text-sm">Female</button>
              <button type="button" (click)="selectGender('Erkek')" 
                [ngClass]="{'bg-[#4F8FC0] text-white': registerForm.value.gender === 'Erkek', 'bg-white text-[#2B3A67]': registerForm.value.gender !== 'Erkek'}"
                class="px-4 py-2 rounded-xl border border-[#4F8FC0] text-sm">Male</button>
            </div>
          </div>

          <div class="space-y-2 text-sm text-[#2B3A67]">
            <label class="flex items-start gap-2">
              <input type="checkbox" formControlName="acceptOffers" class="mt-1"/>
              I consent to processing of personal data.
            </label>
            <label class="flex items-start gap-2">
              <input type="checkbox" formControlName="acceptEmails" class="mt-1"/>
              I agree to receive electronic communications.
            </label>
            <label class="flex items-start gap-2">
              <input type="checkbox" formControlName="acceptTerms" class="mt-1"/>
              I accept the <a href="#" class="text-[#4F8FC0] hover:underline">membership terms</a>.
            </label>
          </div>

          <button type="submit"
            class="bg-gradient-to-r from-[#4F8FC0] to-[#2B3A67] text-white w-full py-3 rounded-xl font-semibold hover:from-[#2B3A67] hover:to-[#A1C4FD] transition">
            Sign Up
          </button>

          <div *ngIf="errorMessage" class="text-red-500 text-sm mt-2">{{ errorMessage }}</div>
        </form>

        <p class="text-xs text-[#2B3A67] mt-4 text-center">
          Already have an account? 
          <a routerLink="/login" class="text-[#4F8FC0] hover:underline">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
