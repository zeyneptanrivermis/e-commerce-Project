<div class="cart-container">
  <h2>MY CART</h2>

  <div *ngIf="cartItems && cartItems.length === 0" class="empty-cart">
    <p>Your Cart is Empty</p>
    <button (click)="goToProducts()">🛒 Start Shopping</button>
  </div>

  <div *ngIf="cartItems && cartItems.length > 0" class="cart-flex-container">

    <!-- Toplam Tutar (Sol Taraf) -->
    <div class="cart-summary">
      <h3>Toplam Tutar</h3>
      <p>{{ totalPrice | currency:'TRY' }}</p>
      <button class="checkout-btn" (click)="goToOrderPage()">Siparişi Tamamla</button>
    </div>

    <!-- Ürün Listesi (Sağ Taraf - Kaydırmalı) -->
    <div class="cart-items">
      <div class="cart-item" *ngFor="let item of cartItems">
        <div class="item-details">
          <p><strong>{{ item.product.name }}</strong></p>
          <div class="quantity-controls">
            <button (click)="decreaseQuantity(item)">−</button>
            <span>{{ item.quantity }}</span>
            <button (click)="increaseQuantity(item)">+</button>
          </div>
          <p>Ürün Toplam: {{ item.totalPrice | currency:'TRY' }}</p>
        </div>
        <button class="delete-btn" (click)="removeItem(item)">Remove from Cart</button>
      </div>
    </div>

  </div>
</div>
