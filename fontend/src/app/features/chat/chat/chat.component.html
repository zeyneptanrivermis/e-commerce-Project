<div class="chat-button" (click)="toggleChat()" (mouseenter)="hover = true" (mouseleave)="hover = false"
     [ngClass]="{'hovered': hover}">
  💬
</div>

<!-- Sohbet ekranı (gizli/açık) -->
<div class="chat-window" *ngIf="chatOpen">
  <!-- Kapatma tuşu -->
  <div class="chat-header">
    <span>Trendyol Assistant</span>
    <button class="close-btn" (click)="toggleChat()">✖</button>
  </div>

  <!-- Mesajlar -->
  <div class="chat-messages">
    <div *ngFor="let msg of messages">
      <strong>{{ msg.sender }}:</strong> {{ msg.text }}
    </div>
  </div>

  <!-- Form -->
  <form [formGroup]="chatForm" (ngSubmit)="sendMessage()" class="chat-form">
    <input formControlName="message" placeholder="Type a message..." />
    <button type="submit">Send</button>
  </form>
</div>
