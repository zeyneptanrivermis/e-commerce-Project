<div class="bg-beyaz rounded-lg shadow-md p-8 relative">
  <h2 class="text-2xl font-semibold text-lacivert-derin mb-6 tracking-wide">Shipment Status for Order #{{ orderId }}</h2>

  <div class="shipment-container">
    <div class="progress-container">
      <div class="progress-bar bg-lavanta-grisi/20 rounded-full h-6 relative overflow-hidden">
        <div class="progress-fill bg-acik-pembe rounded-full h-6" [style.width.%]="progressPercent"></div>
        <div class="wheel-container absolute top-1/2 left-0 -translate-y-1/2" [style.left.%]="progressPercent">
          <span class="wheel slow-spin text-xl">🛞</span>
        </div>
      </div>
      <div class="status-text mt-2 text-gece-yarisi font-semibold">{{ currentStatus }}</div>
    </div>
  </div>

  <ul class="step-list flex justify-between text-sm text-lavanta-grisi mt-6">
    <li
      *ngFor="let step of steps; let i = index"
      [class.font-semibold]="progressPercent >= i/(steps.length-1)*100"
      [class.text-acik-pembe]="progressPercent >= i/(steps.length-1)*100"
      class="relative"
    >
      {{ step }}
      <div *ngIf="i < steps.length - 1" class="absolute top-1/2 -translate-y-1/2 w-full h-0.5 bg-lavanta-grisi/50 left-1/2 -translate-x-1/2 z-[-1]"></div>
      <div *ngIf="progressPercent >= i/(steps.length-1)*100" class="absolute top-1/2 -translate-y-1/2 w-2 h-2 rounded-full bg-acik-pembe left-1/2 -translate-x-1/2"></div>
    </li>
  </ul>
</div>

<style>
@keyframes slow-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.wheel.slow-spin {
  animation: slow-spin 10s linear infinite;
  background: #f48fb1; /* pembe halka */
  border-radius: 50%;
  padding: 6px;
  box-shadow: 0 0 0 4px #f48fb1;
}

.exhaust-smoke {
  font-size: 1.2em;
}

.show-smoke {
  opacity: 1 !important;
}
</style>

<script>
// Example JavaScript code (can be used within an Angular component)
const truckElement = document.querySelector('.truck');
const smokeElement = document.querySelector('.exhaust-smoke');
let previousProgress = 0;
let wheelSpinInterval;

function startWheelSpin() {
  const truckEmoji = truckElement.querySelector('.animate-wheel-spin');
  if (truckEmoji && !wheelSpinInterval) {
    wheelSpinInterval = setInterval(() => {
      // Wheel spinning visual (using CSS animation)
    }, 200); // Check every 200ms
  }
}

function stopWheelSpin() {
  clearInterval(wheelSpinInterval);
  wheelSpinInterval = null;
}

function triggerExhaust() {
  if (smokeElement) {
    smokeElement.classList.add('show-smoke');
    setTimeout(() => {
      smokeElement.classList.remove('show-smoke');
    }, 500); // Duration the smoke is visible
  }
}

function updateTruckPosition(currentProgress) {
  truckElement.style.left = `${currentProgress}%`;
  if (currentProgress > previousProgress) {
    triggerExhaust();
    startWheelSpin(); // Spin wheels while moving forward
    previousProgress = currentProgress;
  } else if (currentProgress === previousProgress) {
    startWheelSpin(); // Keep wheels spinning when stopped
  } else {
    stopWheelSpin(); // Stop wheels if moving backward (optional)
    previousProgress = currentProgress;
  }
}

// You can listen to the progressPercent value and call updateTruckPosition.
// For example:
// this.progressPercent$.subscribe(progress => updateTruckPosition(progress));

// Start the wheels spinning on page load (optional)
document.addEventListener('DOMContentLoaded', startWheelSpin);
</script>
