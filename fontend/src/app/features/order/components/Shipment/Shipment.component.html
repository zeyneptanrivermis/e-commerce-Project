<div class="bg-[#FFF5FD] rounded-lg shadow-md p-8 relative">
  <h2 class="text-2xl font-semibold text-[#005A8D] mb-6 tracking-wide">Shipment Status for Order #{{ orderId }}</h2>

  <div class="relative overflow-hidden rounded-full bg-gray-200 h-6 mb-4">
    <div class="progress-bar bg-[#FF96AD] h-full rounded-full" [style.width.%]="progressPercent"></div>
    <div class="truck absolute top-1/2 left-6 -translate-y-1/2 text-xl text-[#022E57]"
         [style.left.%]="progressPercent"
         style="transition: left 0.5s ease-in-out;">
      <span class="animate-wheel-spin inline-block">🚚</span>
      <span class="exhaust-smoke absolute bottom-0 left-full -translate-x-1/2 opacity-0 transition-opacity duration-500 text-sm">💨</span>
    </div>
  </div>

  <ul class="step-list flex justify-between text-sm text-gray-600">
    <li
      *ngFor="let step of steps; let i = index"
      [class.font-semibold]="progressPercent >= i/(steps.length-1)*100"
      [class.text-[#005A8D]]="progressPercent >= i/(steps.length-1)*100"
      class="relative">
      {{ step }}
      <div *ngIf="i < steps.length - 1" class="absolute top-1/2 -translate-y-1/2 w-full h-0.5 bg-gray-300 left-1/2 -translate-x-1/2 z-[-1]"></div>
      <div *ngIf="progressPercent >= i/(steps.length-1)*100" class="absolute top-1/2 -translate-y-1/2 w-2 h-2 rounded-full bg-[#FF96AD] left-1/2 -translate-x-1/2"></div>
    </li>
  </ul>
</div>

<style>
@keyframes wheel-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.animate-wheel-spin {
  animation: wheel-spin 0.2s linear infinite; /* A fast spin */
}

.exhaust-smoke {
  font-size: 1.2em;
}

.show-smoke {
  opacity: 1 !important;
}
</style>

<script>
// Example JavaScript code (can be used within an Angular component)
const truckElement = document.querySelector('.truck');
const smokeElement = document.querySelector('.exhaust-smoke');
let previousProgress = 0;
let wheelSpinInterval;

function startWheelSpin() {
  const truckEmoji = truckElement.querySelector('.animate-wheel-spin');
  if (truckEmoji && !wheelSpinInterval) {
    wheelSpinInterval = setInterval(() => {
      // Wheel spinning visual (using CSS animation)
    }, 200); // Check every 200ms
  }
}

function stopWheelSpin() {
  clearInterval(wheelSpinInterval);
  wheelSpinInterval = null;
}

function triggerExhaust() {
  if (smokeElement) {
    smokeElement.classList.add('show-smoke');
    setTimeout(() => {
      smokeElement.classList.remove('show-smoke');
    }, 500); // Duration the smoke is visible
  }
}

function updateTruckPosition(currentProgress) {
  truckElement.style.left = `${currentProgress}%`;
  if (currentProgress > previousProgress) {
    triggerExhaust();
    startWheelSpin(); // Spin wheels while moving forward
    previousProgress = currentProgress;
  } else if (currentProgress === previousProgress) {
    startWheelSpin(); // Keep wheels spinning when stopped
  } else {
    stopWheelSpin(); // Stop wheels if moving backward (optional)
    previousProgress = currentProgress;
  }
}

// You can listen to the progressPercent value and call updateTruckPosition.
// For example:
// this.progressPercent$.subscribe(progress => updateTruckPosition(progress));

// Start the wheels spinning on page load (optional)
document.addEventListener('DOMContentLoaded', startWheelSpin);
</script>
