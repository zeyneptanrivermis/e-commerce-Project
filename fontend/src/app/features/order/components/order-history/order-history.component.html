<div *ngIf="isLoading" class="p-4">Loading…</div>

<div *ngIf="!isLoading && orders.length">
  <table class="w-full text-left border-collapse">
    <thead>
      <tr>
        <th class="p-2 border-b">Order ID</th>
        <th class="p-2 border-b">Payment Date</th>
        <th class="p-2 border-b">Total (₺)</th>
        <th class="p-2 border-b">Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let o of orders; trackBy: trackByOrderId">
        <td>
          <a [routerLink]="['/user','shipment', o.orderId]" class="order-link">
            {{ o.orderId }}
          </a>
        </td>
        <td>{{ o.paymentDate | date:'short' }}</td>
        <td>{{ o.totalWithDiscount | currency:'TRY':'symbol' }}</td>
        <td>{{ o.status }}</td>
        <td>
          <!-- Artık tüm durumlarda buton görünecek -->
          <button
            class="refund-button"
            [disabled]="isLoading"
            (click)="confirmRefund(o.orderId)">
            İade Talep Et
          </button>
        </td>
        <td class="p-2 border-b">{{ o.paymentDate | date:'short' }}</td>
        <td class="p-2 border-b">{{ o.totalWithDiscount | currency:'TRY':'symbol' }}</td>
        <td class="p-2 border-b">{{ o.status }}</td>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="!isLoading && !orders.length" class="p-4 text-center">
  You have no past orders.
</div>
