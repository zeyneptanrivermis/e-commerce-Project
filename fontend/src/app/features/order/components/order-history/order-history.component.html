<div *ngIf="isLoading" class="loading text-center py-8 text-lavanta-grisi">Loading…</div>

<div *ngIf="!isLoading && orders.length" class="overflow-x-auto rounded-lg shadow-md bg-beyaz">
  <table class="order-table min-w-full divide-y divide-lavanta-grisi/20">
    <thead class="bg-gece-yarisi text-beyaz">
      <tr>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Order ID</th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Payment Date</th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Total (₺)</th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Status</th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider">Items</th>
        <th scope="col" class="px-6 py-3 text-right text-xs font-medium uppercase tracking-wider">Action</th>
      </tr>
    </thead>
    <tbody class="bg-beyaz divide-y divide-lavanta-grisi/20 text-lacivert-derin">
      <tr *ngFor="let o of orders; trackBy: trackByOrderId">
        <td class="px-6 py-4 whitespace-nowrap">
          <a [routerLink]="['/user','shipment', o.orderId]" class="order-link text-acik-pembe hover:text-lavanta-grisi transition-colors duration-200">
            {{ o.orderId }}
          </a>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-sm">{{ o.paymentDate | date:'short' }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm">{{ o.totalWithDiscount | currency:'TRY':'symbol' }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm">{{ o.status }}</td>
        <td class="px-6 py-4 text-sm">
          <div class="space-y-2">
            <div *ngFor="let item of o.itemList" class="flex items-center justify-between">
              <a [routerLink]="['/products', item.productId]" 
                 class="text-acik-pembe hover:text-lavanta-grisi transition-colors duration-200">
                {{ item.productName }} ({{ item.quantity }}x)
              </a>
              <span class="text-lacivert-derin ml-2">{{ item.totalPrice | currency:'TRY':'symbol' }}</span>
            </div>
          </div>
        </td>
        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
          <button
            class="refund-button bg-acik-pembe hover:bg-lavanta-grisi text-lacivert-derin font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition-colors duration-200"
            [disabled]="isLoading"
            (click)="confirmRefund(o.orderId)">
            Request Refund
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="!isLoading && !orders.length" class="no-orders text-center py-8 text-lavanta-grisi">
  You have no past orders.
</div>
