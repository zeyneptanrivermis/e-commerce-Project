<div *ngIf="isLoading" class="loading">Loading…</div>

<div *ngIf="!isLoading && orders.length">
  <table class="order-table">
    <thead>
      <tr>
        <th>Order ID</th>
        <th>Payment Date</th>
        <th>Total (₺)</th>
        <th>Status</th>
        <th>İşlem</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let o of orders">
        <td>
          <a [routerLink]="['/user','shipment', o.orderId]" class="order-link">
            {{ o.orderId }}
          </a>
        </td>
        <td>{{ o.paymentDate | date:'short' }}</td>
        <td>{{ o.totalWithDiscount | currency:'TRY':'symbol' }}</td>
        <td>{{ o.status }}</td>
        <td>
          <button *ngIf="o.status !== 'CANCELLED' && o.status !== 'DELIVERED'"
                  class="refund-button"
                  (click)="confirmRefund(o.orderId)">
            İade Talep Et
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="!isLoading && !orders.length" class="no-orders">
  You have no past orders.
</div>
