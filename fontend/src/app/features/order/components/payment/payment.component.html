<!-- src/app/features/order/components/payment/payment.component.html -->
<form [formGroup]="paymentForm" (ngSubmit)="submitPayment()" class="payment-form">
  <!-- Tutar Alanı (sürekli disabled olacak) -->
  <div class="form-group">
    <label for="amount">Tutar (kuruş)</label>
    <input
      id="amount"
      type="number"
      formControlName="amount"
      [disabled]="true"
    />
  </div>

  <!-- Kart Sahibinin Adı -->
  <div class="form-group">
    <label for="cardholder">Kart Üzerindeki İsim</label>
    <input
      id="cardholder"
      type="text"
      formControlName="cardholder"
      class="form-control"
      [class.is-invalid]="
        paymentForm.get('cardholder')!.invalid &&
        (paymentForm.get('cardholder')!.touched ||
         paymentForm.get('cardholder')!.dirty)
      "
    />
    <div
      *ngIf="
        paymentForm.get('cardholder')!.invalid &&
        paymentForm.get('cardholder')!.touched
      "
      class="invalid-feedback"
    >
      Lütfen kart üzerindeki ismi girin.
    </div>
  </div>

  <!-- Stripe Elements Kart Bilgileri -->
  <div class="form-group">
    <label>Kart Bilgileri</label>
    <div #cardInfo class="card-element"></div>
    <div id="card-errors" role="alert" class="text-danger mt-2"></div>
  </div>

  <!-- Gönder Butonu -->
  <button
    type="submit"
    class="btn btn-primary"
    [disabled]="paymentForm.invalid"
  >
    Ödeme Yap
  </button>
</form>
