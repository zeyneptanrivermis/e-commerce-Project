<!-- payment.component.html -->
<div class="payment-page" *ngIf="paymentForm">
  <form
    [formGroup]="paymentForm"
    (ngSubmit)="submitPayment()"
    id="payment-form"
    novalidate
  >
    <!-- Amount Due -->
    <div class="form-group">
      <label for="amount">Amount Due</label>
      <input
        id="amount"
        type="text"
        class="form-control"
        formControlName="amount"
        readonly
      />
    </div>

    <!-- Cardholder Name -->
    <div class="form-group">
      <label for="cardholder">Cardholder Name</label>
      <input
        id="cardholder"
        type="text"
        class="form-control"
        formControlName="cardholder"
        placeholder="Enter cardholder name"
        [class.is-invalid]="
          paymentForm.get('cardholder')?.invalid &&
          paymentForm.get('cardholder')?.touched
        "
      />
      <div
        *ngIf="
          paymentForm.get('cardholder')?.invalid &&
          paymentForm.get('cardholder')?.touched
        "
        class="invalid-feedback"
      >
        Please enter the cardholder’s name.
      </div>
    </div>

    <!-- Card Number -->
    <div class="form-group">
      <label for="cardNumber">Card Number</label>
      <input
        id="cardNumber"
        type="text"
        class="form-control"
        formControlName="cardNumber"
        placeholder="1234 5678 9012 3456"
        maxlength="19"
        [class.is-invalid]="
          paymentForm.get('cardNumber')?.invalid &&
          paymentForm.get('cardNumber')?.touched
        "
      />
      <div
        *ngIf="
          paymentForm.get('cardNumber')?.invalid &&
          paymentForm.get('cardNumber')?.touched
        "
        class="invalid-feedback"
      >
        Please enter a valid card number.
      </div>
    </div>

    <!-- Expiration Date & CVV -->
    <div class="form-row">
      <div class="form-group half">
        <label>Expiration Date</label>
        <div class="inline-inputs">
          <input
            type="text"
            class="form-control"
            formControlName="expiryMonth"
            placeholder="MM"
            maxlength="2"
            [class.is-invalid]="
              paymentForm.get('expiryMonth')?.invalid &&
              paymentForm.get('expiryMonth')?.touched
            "
          />
          <span>/</span>
          <input
            type="text"
            class="form-control"
            formControlName="expiryYear"
            placeholder="YY"
            maxlength="2"
            [class.is-invalid]="
              paymentForm.get('expiryYear')?.invalid &&
              paymentForm.get('expiryYear')?.touched
            "
          />
        </div>
        <div
          *ngIf="
            (paymentForm.get('expiryMonth')?.invalid ||
              paymentForm.get('expiryYear')?.invalid) &&
            (paymentForm.get('expiryMonth')?.touched ||
              paymentForm.get('expiryYear')?.touched)
          "
          class="invalid-feedback"
        >
          Please enter a valid expiration date.
        </div>
      </div>

      <div class="form-group half">
        <label for="cvv">CVV</label>
        <input
          id="cvv"
          type="password"
          class="form-control"
          formControlName="cvv"
          placeholder="123"
          maxlength="4"
          [class.is-invalid]="
            paymentForm.get('cvv')?.invalid &&
            paymentForm.get('cvv')?.touched
          "
        />
        <div
          *ngIf="
            paymentForm.get('cvv')?.invalid &&
            paymentForm.get('cvv')?.touched
          "
          class="invalid-feedback"
        >
          Please enter a valid CVV.
        </div>
      </div>
    </div>

    <button
      type="submit"
      class="btn-primary w-100 mt-3"
      [disabled]="paymentForm.invalid"
    >
      Pay Now
    </button>
  </form>
</div>
