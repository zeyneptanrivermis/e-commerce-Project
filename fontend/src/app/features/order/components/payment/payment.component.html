<form [formGroup]="paymentForm" (ngSubmit)="submitPayment()" class="payment-form bg-white rounded-lg shadow-md p-6 space-y-4">
  <div class="form-group">
    <label for="amount" class="block text-sm font-medium text-gray-700">Tutar (kuruş)</label>
    <input
      id="amount"
      type="number"
      formControlName="amount"
      [disabled]="true"
      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-gray-900"
    />
  </div>

  <div class="form-group">
    <label for="cardholder" class="block text-sm font-medium text-gray-700">Kart Üzerindeki İsim</label>
    <input
      id="cardholder"
      type="text"
      formControlName="cardholder"
      class="form-control mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-gray-900"
      [class.is-invalid]="
        paymentForm.get('cardholder')!.invalid &&
        (paymentForm.get('cardholder')!.touched ||
         paymentForm.get('cardholder')!.dirty)
      "
    />
    <div
      *ngIf="
        paymentForm.get('cardholder')!.invalid &&
        paymentForm.get('cardholder')!.touched
      "
      class="invalid-feedback text-red-500 text-sm mt-1"
    >
      Lütfen kart üzerindeki ismi yazın.
    </div>
  </div>

  <div class="form-group">
    <label class="block text-sm font-medium text-gray-700">Kart Bilgileri</label>
    <div #cardInfo class="card-element border rounded-md p-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></div>
    <div id="card-errors" role="alert" class="text-red-500 mt-2 text-sm"></div>
  </div>

  <button
    type="submit"
    class="btn btn-primary bg-indigo-600 text-white rounded-md py-3 px-6 font-semibold hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:bg-gray-400"
    [disabled]="paymentForm.invalid"
  >
    Ödeme Yap
  </button>
</form>
