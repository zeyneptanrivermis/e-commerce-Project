<div class="container mx-auto p-6 bg-[#FEFCFB] rounded-md shadow-md">

    <!-- Add / Update Product Form -->
    <div class="form-section">
      <h2>{{ isEditMode ? 'Update Product' : 'Add New Product' }}</h2>

      <form [formGroup]="productForm" (ngSubmit)="onSubmit()">

        <!-- Product Name -->
        <div>
          <label>Product Name</label>
          <input type="text" formControlName="name" placeholder="Enter product name">
          <div *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched">
            Product name is required.
          </div>
        </div>

        <!-- Price -->
        <div>
          <label>Price (₺)</label>
          <input type="number" formControlName="price" placeholder="Enter price">
          <div *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched">
            Please enter a valid price.
          </div>
        </div>

        <!-- Description -->
        <div>
          <label>Description</label>
          <textarea formControlName="description" placeholder="Product description"></textarea>
        </div>

    <!-- Main Category -->
    <div>
        <label>Main Category</label>
      <select formControlName="mainCategory" (change)="onMainCategoryChange($event)">
        <option *ngFor="let cat of mainCategories" [value]="cat">
          {{ formatCategory(cat) }}
        </option>
</select>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-[#034078]">Product Name</label>
        <input type="text" formControlName="name" placeholder="Enter product name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-[#1282A2] focus:ring-[#1282A2]">
        <div *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched" class="text-red-500 text-sm">
          Product name is required.
        </div>
      </div>

    <div *ngIf="availableSideCategories.length > 0">
      <label>Subcategories:</label>
      <div *ngFor="let sideCat of availableSideCategories">
        <input type="checkbox"
          [checked]="productForm.value.sideCategories?.includes(sideCat) || false"
          (change)="toggleSideCategory(sideCat, $event)">

      <div>
        <label class="block text-sm font-medium text-[#034078]">Price (₺)</label>
        <input type="number" formControlName="price" placeholder="Enter price" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-[#1282A2] focus:ring-[#1282A2]">
        <div *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched" class="text-red-500 text-sm">
          Enter a valid price.
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-[#034078]">Description</label>
        <textarea formControlName="description" placeholder="Enter product description" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-[#1282A2] focus:ring-[#1282A2]"></textarea>
      </div>

        <!-- Shipping Cost -->
        <div>
          <label>Shipping Cost (₺)</label>
          <input type="number" formControlName="shippingCost" placeholder="Enter shipping cost">
        </div>

        <!-- Stock -->
        <div>
          <label>Stock Quantity</label>
          <input type="number" formControlName="stockCount" placeholder="Stock quantity">
          <div *ngIf="productForm.get('stockCount')?.invalid && productForm.get('stockCount')?.touched">
            Stock must be between 1 and 500.
          </div>
        </div>

        <!-- Submit Buttons -->
        <div class="button-group">
          <button type="submit" [disabled]="productForm.invalid">{{ isEditMode ? 'Update' : 'Add' }}</button>
        </div>

      </form>
    </div>
