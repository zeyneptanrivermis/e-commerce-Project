<div class="container mx-auto p-6 bg-beyaz rounded-md shadow-md">

  <div class="form-section">
    <h2 class="text-2xl font-semibold text-lacivert-derin mb-6 tracking-wide">{{ isEditMode ? 'Update Product' : 'Add New Product' }}</h2>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-4">

      <div>
        <label class="block text-sm font-medium text-gece-yarisi">Product Name</label>
        <input type="text" formControlName="name" placeholder="Enter product name"
               class="mt-1 block w-full rounded-md border-lavanta-grisi shadow-sm focus:border-acik-pembe focus:ring-acik-pembe text-lacivert-derin">
        <div *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched"
             class="text-acik-pembe text-sm">
          Product name is required.
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gece-yarisi">Price (₺)</label>
        <input type="number" formControlName="price" placeholder="Enter price"
               class="mt-1 block w-full rounded-md border-lavanta-grisi shadow-sm focus:border-acik-pembe focus:ring-acik-pembe text-lacivert-derin">
        <div *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched"
             class="text-acik-pembe text-sm">
          Please enter a valid price.
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gece-yarisi">Description</label>
        <textarea formControlName="description" placeholder="Product description"
                  class="mt-1 block w-full rounded-md border-lavanta-grisi shadow-sm focus:border-acik-pembe focus:ring-acik-pembe text-lacivert-derin"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gece-yarisi">Main Category</label>
        <select formControlName="mainCategory" (change)="onMainCategoryChange($event)"
                class="mt-1 block w-full rounded-md border-lavanta-grisi shadow-sm focus:border-acik-pembe focus:ring-acik-pembe text-lacivert-derin bg-beyaz">
          <option *ngFor="let cat of mainCategories" [value]="cat">
            {{ formatCategory(cat) }}
          </option>
        </select>
      </div>

      <div *ngIf="availableSideCategories.length > 0">
        <label class="block text-sm font-medium text-gece-yarisi mb-2">Subcategories</label>
        <div class="space-y-2">
          <div *ngFor="let sideCat of availableSideCategories" class="flex items-center">
            <input type="checkbox" [id]="'sideCat-' + sideCat"
                   [checked]="productForm.value.sideCategories?.includes(sideCat) || false"
                   (change)="toggleSideCategory(sideCat, $event)"
                   class="rounded border-lavanta-grisi text-acik-pembe focus:ring-acik-pembe">
            <label [for]="'sideCat-' + sideCat" class="ml-2 text-sm text-lacivert-derin">{{ sideCat }}</label>
          </div>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gece-yarisi">Shipping Cost (₺)</label>
        <input type="number" formControlName="shippingCost" placeholder="Enter shipping cost"
               class="mt-1 block w-full rounded-md border-lavanta-grisi shadow-sm focus:border-acik-pembe focus:ring-acik-pembe text-lacivert-derin">
      </div>

      <div>
        <label class="block text-sm font-medium text-gece-yarisi">Stock Quantity</label>
        <input type="number" formControlName="stockCount" placeholder="Stock quantity"
               class="mt-1 block w-full rounded-md border-lavanta-grisi shadow-sm focus:border-acik-pembe focus:ring-acik-pembe text-lacivert-derin">
        <div *ngIf="productForm.get('stockCount')?.invalid && productForm.get('stockCount')?.touched"
             class="text-acik-pembe text-sm">
          Stock must be between 1 and 500.
        </div>
      </div>

      <div class="mt-6">
        <button type="submit" [disabled]="productForm.invalid"
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-acik-pembe hover:bg-lavanta-grisi focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-acik-pembe disabled:opacity-50 transition-colors duration-200">
          {{ isEditMode ? 'Update Product' : 'Add Product' }}
        </button>
      </div>
    </form>
  </div>
</div>
