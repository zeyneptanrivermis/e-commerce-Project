<div class="recommendation-box">
  <h5 class="sidebar-title">Beğenebileceğin Ürünler</h5>
  <div class="recommendation-cards">
    <div
      class="rec-card"
      *ngFor="let item of recommendations"
      (click)="goToProduct(item.product.id)"
    >
      <div class="rec-info">
        <a
          class="rec-name"
          [routerLink]="['/products', item.product.id]"
        >
          {{ item.product.name }}
        </a>
        <p class="rec-price">{{ item.product.price | currency }}</p>
      </div>
    </div>
  </div>
</div>
