<div class="bg-beyaz rounded-lg shadow-md p-8">
  <h2 class="text-2xl font-semibold text-acik-pembe mb-6 tracking-wide">Wishlist</h2>

  <div *ngIf="wishlist.length === 0" class="text-center py-6">
    <p class="text-lavanta-grisi mb-4">Your Wishlist is empty.</p>
    <button class="bg-acik-pembe text-lacivert-derin py-3 px-6 rounded-md hover:bg-lavanta-grisi transition duration-200 focus:outline-none">Explore Products</button>
  </div>

  <div *ngFor="let product of wishlist" class="wishlist-item bg-gece-yarisi/5 rounded-lg shadow-sm p-6 mb-4 flex items-center justify-between">
    <p class="text-acik-pembe font-medium">{{ product.name }} – <span class="text-lavanta-grisi">{{ product.price | currency:'TRY' }}</span></p>

    <div class="flex items-center space-x-4">
      <div class="quantity-control flex items-center border border-lavanta-grisi rounded-md">
        <button (click)="decreaseQuantity(product)" [disabled]="quantities[product.id] <= 1"
                class="px-3 py-2 text-lavanta-grisi hover:bg-lavanta-grisi/10 focus:outline-none disabled:opacity-50">–</button>
        <span class="px-4 py-2 text-lacivert-derin">{{ quantities[product.id] }}</span>
        <button (click)="increaseQuantity(product)"
                class="px-3 py-2 text-lavanta-grisi hover:bg-lavanta-grisi/10 focus:outline-none">+</button>
      </div>

      <button class="add-to-cart-button bg-acik-pembe text-lacivert-derin py-2 px-4 rounded-md hover:bg-lavanta-grisi transition duration-200 text-sm font-medium focus:outline-none"
              (click)="addToCart(product)">
        Add to Cart
      </button>

      <button class="remove-button text-acik-pembe hover:text-lavanta-grisi focus:outline-none text-sm transition-colors duration-200"
              (click)="removeFromWishlist(product.id)">
        Remove
      </button>
    </div>
  </div>
</div>
