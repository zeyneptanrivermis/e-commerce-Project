<div class="bg-[#FFF5FD] rounded-lg shadow-md p-8">
  <h2 class="text-2xl font-semibold text-[#005A8D] mb-6 tracking-wide">Wishlist</h2>

  <div *ngIf="wishlist.length === 0" class="text-center py-6">
    <p class="text-gray-600 mb-4">Your Wishlist is empty.</p>
    <button class="bg-[#005A8D] text-[#FFF5FD] py-3 px-6 rounded-md hover:bg-[#022E57] transition duration-200 focus:outline-none">Explore Products</button>
  </div>

  <div *ngFor="let product of wishlist" class="wishlist-item bg-white rounded-lg shadow-sm p-6 mb-4 flex items-center justify-between">
    <p class="text-[#005A8D] font-medium">{{ product.name }} – <span class="text-gray-700">{{ product.price | currency:'TRY' }}</span></p>

    <div class="flex items-center space-x-4">
      <div class="quantity-control flex items-center border border-gray-300 rounded-md">
        <button (click)="decreaseQuantity(product)" [disabled]="quantities[product.id] <= 1"
                class="px-3 py-2 text-gray-600 hover:bg-gray-100 focus:outline-none disabled:opacity-50">–</button>
        <span class="px-4 py-2 text-gray-700">{{ quantities[product.id] }}</span>
        <button (click)="increaseQuantity(product)"
                class="px-3 py-2 text-gray-600 hover:bg-gray-100 focus:outline-none">+</button>
      </div>

      <button class="add-to-cart-button bg-[#FF96AD] text-[#FFF5FD] py-2 px-4 rounded-md hover:bg-[#022E57] transition duration-200 text-sm font-medium focus:outline-none"
              (click)="addToCart(product)">
        Add to Cart
      </button>

      <button class="remove-button text-red-500 hover:text-red-700 focus:outline-none text-sm"
              (click)="removeFromWishlist(product.id)">
        Remove
      </button>
    </div>
  </div>
</div>
