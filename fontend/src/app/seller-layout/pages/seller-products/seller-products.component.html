<div class="min-h-screen bg-[#F3E8F9] flex flex-col md:flex-row">
  <!-- Sidebar -->
  <app-seller-menu class="w-full md:w-60"></app-seller-menu>

  <!-- Main Content -->
  <main class="flex-1 p-4 sm:p-6 md:p-10 bg-[#F3E8F9]">
    <h1 class="text-2xl sm:text-3xl font-bold text-[#1C1C3A] mb-6 flex items-center gap-2">
      💼 <span>Product Management</span>
    </h1>

    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
      <!-- My Products -->
      <section class="xl:col-span-2 bg-white p-4 sm:p-6 rounded-2xl shadow-md border border-[#DDC4E8]">
        <h2 class="text-lg sm:text-xl font-semibold text-[#1C1C3A] mb-4">My Products</h2>
        <div class="overflow-x-auto rounded-lg border border-[#E5D5F3]">
          <table class="min-w-full text-xs sm:text-sm text-left">
            <thead class="bg-[#F9F0FF] text-[#4A3F68]">
              <tr>
                <th class="py-3 px-4 font-semibold">Product ID</th>
                <th class="py-3 px-4 font-semibold">Product Name</th>
                <th class="py-3 px-4 font-semibold">Price</th>
                <th class="py-3 px-4 font-semibold">Category</th>
                <th class="py-3 px-4 font-semibold">Stock</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let p of products" class="border-t hover:bg-[#FAF5FF]">
                <td class="py-2 px-4">{{ p.id }}</td>
                <td class="py-2 px-4">{{ p.name }}</td>
                <td class="py-2 px-4">{{ p.price | currency:'TRY' }}</td>
                <td class="py-2 px-4">{{ p.mainCategory }}</td>
                <td class="py-2 px-4">{{ p.stockCount }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Add New Product -->
      <section class="bg-white p-4 sm:p-6 rounded-2xl shadow-md border border-[#DDC4E8] h-fit">
        <h2 class="text-lg sm:text-xl font-semibold text-[#1C1C3A] mb-4">Add New Product</h2>
        <app-manage-products></app-manage-products>
      </section>
    </div>
  </main>
</div>
